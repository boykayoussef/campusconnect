name: Verify CampusConnect
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and verify backend
        working-directory: backend
        run: npm install && node --check server.js && node --check app.js
      - name: Install and verify mobile
        working-directory: mobile
        run: npm install && npx expo export --platform web

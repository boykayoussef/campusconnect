name: CampusConnect CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install backend
        working-directory: backend
        run: npm install
      - name: Check backend syntax
        working-directory: backend
        run: |
          node --check server.js
          node --check app.js
          node --check controllers/authController.js
          node --check controllers/eventController.js
          node --check controllers/registrationController.js
          node --check controllers/userController.js
          node --check middleware/authMiddleware.js
          node --check middleware/roleMiddleware.js
          node --check middleware/errorHandler.js
